# ==========================================
# 复制此文件为 application-dev.yml，修改为你的本地配置
#   cp application-dev-example.yml application-dev.yml
# application-dev.yml 已在 .gitignore 中，不会被提交
# ==========================================

spring:
  datasource:
    url: jdbc:mysql://your_mysql_host:3306/devops_log?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

devops:
  clickhouse:
    url: jdbc:clickhouse://your_clickhouse_host:8123/devops
    username: default
    password: ""
  access-log:
    service-name: log
    output-dir: ../shared-logs/access
    file-pattern: "access-{date}.jsonl"
    log-body: true
    body-on-error-only: true
    max-body-length: 4096
    slow-request-threshold-ms: 3000
  metrics:
    aggregate:
      enabled: true
      window-minutes: 5
      cron: "0 */5 * * * *"
      backfill-windows: 12
