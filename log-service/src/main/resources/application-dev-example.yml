# 复制为 application-dev.yml（已在 .gitignore）
server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://your_mysql_host:3306/devops_log?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

devops:
  clickhouse:
    url: jdbc:clickhouse://localhost:8123/devops
    username: default
    password: ""
  access-log:
    service-name: log
    output-dir: shared-logs/access
    file-pattern: "access-{date}.jsonl"
    log-body: true
    body-on-error-only: true
    max-body-length: 4096
    slow-request-threshold-ms: 3000
  metrics:
    aggregate:
      enabled: true
      window-minutes: 5
      cron: "0 */5 * * * *"
      backfill-windows: 12
