spring:
  datasource:
    url: jdbc:mysql://mysql:3306/devops_log?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

devops:
  clickhouse:
    url: jdbc:clickhouse://clickhouse:8123/devops
    username: default
    password: ""
  internal:
    token: ${DEVOPS_INTERNAL_TOKEN:dev-internal-secret}
  access-log:
    service-name: log
    output-dir: logs/access
    file-pattern: "access-{date}.jsonl"
    log-body: true
    body-on-error-only: true
    max-body-length: 4096
    slow-request-threshold-ms: 3000
  metrics:
    aggregate:
      enabled: true
      window-minutes: 5
      cron: "0 */5 * * * *"
      backfill-windows: 12
