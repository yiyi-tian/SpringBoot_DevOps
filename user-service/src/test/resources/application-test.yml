spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=GROUP,USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 为 AccessLogConfiguration 提供必要的属性
devops:
  access-log:
    service-name: user-service-test
    output-dir: target/test-access-logs

logging:
  level:
    org.example.userservice: DEBUG
