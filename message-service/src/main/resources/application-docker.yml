spring:
  datasource:
    url: jdbc:mysql://mysql:3306/devops_message?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      timeout: 10000ms
  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

devops:
  internal:
    token: ${DEVOPS_INTERNAL_TOKEN:dev-internal-secret}
  mail:
    from: ${DEVOPS_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  access-log:
    service-name: message
    output-dir: logs/access
    file-pattern: "access-{date}.jsonl"
    log-body: true
    body-on-error-only: true
    max-body-length: 4096
    slow-request-threshold-ms: 3000
