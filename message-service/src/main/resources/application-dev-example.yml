# ==========================================
# 复制此文件为 application-dev.yml，修改为你的本地配置
#   cp application-dev-example.yml application-dev.yml
# application-dev.yml 已在 .gitignore 中，不会被提交
# ==========================================

spring:
  datasource:
    url: jdbc:mysql://your_mysql_host:3306/devops_message?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: your_redis_host
      port: 6379
      password: your_redis_password
      timeout: 10000ms
  mail:
    host: smtp.qq.com
    port: 465
    username: your_email@qq.com
    password: your_smtp_auth_code
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000
        debug: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

devops:
  mail:
    from: your_email@qq.com
  access-log:
    service-name: message
    output-dir: ../shared-logs/access
    file-pattern: "access-{date}.jsonl"
    log-body: true
    body-on-error-only: true
    max-body-length: 4096
    slow-request-threshold-ms: 3000
