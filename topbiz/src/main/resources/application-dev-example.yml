# 复制为 application-dev.yml 并填写云端 Redis 密码（application-dev.yml 已在 .gitignore）
spring:
  data:
    redis:
      host: your_redis_host
      port: 6379
      password: your_redis_password
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
