server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID

spring:
  profiles:
    active: dev
  application:
    name: topbiz
  session:
    timeout: 30m
    redis:
      namespace: shiro:session

shiro:
  sessionManager:
    sessionIdUrlRewritingEnabled: false

devops:
  services:
    user-url: http://localhost:8081
    message-url: http://localhost:8082
    log-url: http://localhost:8083
  internal:
    token: ${DEVOPS_INTERNAL_TOKEN:}
  messaging:
    welcome:
      template-id: 1
      channel-type: IN_APP
    template:
      default-status: DRAFT
  access-log:
    service-name: topbiz
    output-dir: ../shared-logs/access
    file-pattern: "access-{date}.jsonl"
    log-body: true
    body-on-error-only: true
    max-body-length: 4096
    slow-request-threshold-ms: 3000
